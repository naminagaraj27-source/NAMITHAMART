<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NAMITHAMART</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/chatbot.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">

  <div style="width: 100%; max-width: 440px;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="/index.html" class="brand-logo" style="justify-content: center; font-size: 2.2rem; color: var(--color-primary);">
        NAMITHAMART
      </a>
      <p style="color: var(--color-text-secondary); font-size: 0.95rem; margin-top: 6px;">
        Sign in to your multi-seller account
      </p>
    </div>

    <!-- Login Card -->
    <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 32px 28px;">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 8px;">
          Sign In to NAMITHAMART
        </button>
      </form>

      <!-- Quick Demo Access Pills -->
      <div style="margin-top: 26px; border-top: 1px solid var(--color-border); padding-top: 18px; text-align: center;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px;">
          One-Click Demo Fill:
        </span>
        <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
          <button onclick="fillDemo('buyer@namithamart.com', 'buyer123')" class="btn btn-sm btn-light">Buyer</button>
          <button onclick="fillDemo('seller@namithamart.com', 'seller123')" class="btn btn-sm btn-light">Seller</button>
          <button onclick="fillDemo('admin@namithamart.com', 'admin123')" class="btn btn-sm btn-light">Admin</button>
        </div>
      </div>
    </div>

    <!-- Register Link -->
    <div style="text-align: center; margin-top: 16px; font-size: 0.92rem; color: var(--color-text-dark);">
      Don't have an account yet? 
      <a href="/register.html" style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">
        Register on NAMITHAMART
      </a>
    </div>

    <div style="text-align: center; margin-top: 12px;">
      <a href="/index.html" style="color: var(--color-secondary); font-size: 0.88rem;">&larr; Back to Home</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chatbot.js"></script>

  <script>
    function fillDemo(email, pass) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      try {
        const res = await API.login(email, pass);
        showToast(`Welcome back, ${res.user.name}!`);

        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else if (res.user.role === 'seller') {
            window.location.href = '/seller-dashboard.html';
          } else {
            window.location.href = '/buyer-dashboard.html';
          }
        }, 600);

      } catch (err) {
        alert(err.message || 'Login failed. Please verify your credentials.');
        btn.disabled = false;
        btn.innerText = 'Sign In to NAMITHAMART';
      }
    }
  </script>
</body>
</html>
